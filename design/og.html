<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nested og image</title>
<style>
  @font-face { font-family: "Literata"; src: url("../assets/fonts/Literata-400-normal-latin.woff2") format("woff2"); font-weight: 400 500; }
  @font-face { font-family: "Instrument Sans"; src: url("../assets/fonts/InstrumentSans-400-normal-latin.woff2") format("woff2"); font-weight: 400 500; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f6efe4; color: #1e1c19; font-family: "Instrument Sans", sans-serif; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; display: flex; align-items: center; gap: 72px; padding: 0 96px; box-sizing: border-box; }
  .icon { width: 300px; height: 300px; flex: none; }
  h1 { margin: 0 0 22px; font: 500 64px/1 "Instrument Sans", sans-serif; letter-spacing: -0.02em; }
  p { margin: 0; font: 400 46px/1.25 "Literata", serif; max-width: 640px; }
  mark { background: oklch(0.93 0.06 95); color: inherit; padding: 0 .08em; }
  .foot { position: absolute; left: 96px; bottom: 44px; font-size: 22px; color: #8e887e; }
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="../assets/icon/icon-1024-squircle.png" alt="">
  <div>
    <h1>Nested</h1>
    <p>Highlight your <mark>understanding</mark>. A calm research reader for a folder of Markdown notes, for Mac.</p>
  </div>
  <div class="foot">nestedreader.app</div>
</div>
</body>
</html>
